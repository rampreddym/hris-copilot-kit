name: Release

# Publish a release on GitHub (Releases > Draft a new release, with a new tag
# like v2026.11.1). This workflow then builds the downloads and attaches them.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-downloads:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python scripts/build.py --check
      - name: Build downloads
        run: python scripts/build.py --version "$TAG"
      - name: Attach downloads to the release
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
